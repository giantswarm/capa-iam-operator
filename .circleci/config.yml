version: 2.1

orbs:
  architect: giantswarm/architect@10.13.0

workflows:
  build:
    jobs:
    - architect/go-build:
        context: architect
        name: go-build
        binary: capa-iam-operator
        resource_class: large
        pre_test_target: generate
        test_target: test-unit
        filters:
          tags:
            only: /^v.*/

    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        # the Dockerfile compiles with GOARCH=amd64, so the image is amd64-only (orb 10 defaults to amd64+arm64)
        platforms: linux/amd64
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master
    - architect/push-to-app-catalog:
        context: architect
        executor: app-build-suite
        name: push-capa-iam-operator-to-app-catalog
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        chart: capa-iam-operator
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master
